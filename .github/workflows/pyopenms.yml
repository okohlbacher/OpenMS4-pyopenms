name: pyOpenMS

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'Casks/**'
      - 'README.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.platform }} / Release
    # Existing packages use registered private runners for trusted builds.
    # Fork PRs and new packages without registered runners use hosted machines.
    runs-on: ${{ (github.event_name != 'pull_request' && matrix.pool) || matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            pool: dax-linux-x64
            packages: gcc_linux-64=14 gxx_linux-64=14 coin-or-cbc=2.10.*
            jobs: 4
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            pool: ''
            packages: gcc_linux-aarch64=14 gxx_linux-aarch64=14 coin-or-cbc=2.10.*
            jobs: 4
          - platform: macos-arm64
            runner: macos-15
            pool: studio-macos-arm64
            packages: llvm-openmp coin-or-cbc=2.10.*
            jobs: 2
          - platform: macos-x64
            runner: macos-15-intel
            pool: ''
            packages: llvm-openmp coin-or-cbc=2.10.*
            jobs: 4
          - platform: windows-x64
            runner: windows-2022
            pool: flashbox-windows-x64
            packages: glpk=5.*
            jobs: 4
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      # Parallel launches of freshly built binaries stall ~25 s on the Mac Studio runner (in
      # syspolicyd); serial launches do not. The drivers run ctest serially when this is 1.
      OPENMS4_SERIAL_TESTS: ${{ startsWith(runner.name, 'studio-') && '1' || '0' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: okohlbacher/OpenMS4-cli
          ref: 88e7216996b6973aa09e75663ec1284fbb388dd9
          path: dependencies/cli
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: okohlbacher/OpenMS4-test-data
          ref: 7349fc9977bbb9653c3571364e5b4688be442846
          path: dependencies/test-data
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: okohlbacher/OpenMS4-prose
          ref: 62eaf2e56a49a8aea0fd21d38b0ff6c98ea96a45
          path: dependencies/prose
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: okohlbacher/OpenMS4-flash
          ref: 0df52175d3b82aa83e5ebc6b8a035adf7e4c1bf9
          path: dependencies/flash
          persist-credentials: false
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          environment-file: tools/ci/environment.yml
          micromamba-version: 2.9.0-0
          create-args: ${{ matrix.packages }}
          init-shell: none
          generate-run-shell: false
          cache-environment: true
          cache-environment-key: pyopenms-${{ matrix.platform }}
          post-cleanup: all
      - name: Install the exact nanobind the bindings require
        shell: bash
        run: |
          # The bindings ask for nanobind 2.10.0 EXACT. conda-forge went from
          # 2.9.2 to 2.10.2 without packaging 2.10.0, so it comes from PyPI.
          micromamba run -n package-ci python -m pip install --no-input nanobind==2.10.0
          micromamba run -n package-ci python -c "import nanobind, sys; assert nanobind.__version__ == '2.10.0', nanobind.__version__; print('nanobind', nanobind.__version__)"
      - name: Download and verify the pinned core SDK
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/core"
          gh release download core-v4.0.0-ci.4 --repo okohlbacher/OpenMS4-core \
            --pattern "OpenMS4-core-${{ matrix.platform }}-Release-4f5c86fd90f3.tar.gz*" \
            --dir "${{ runner.temp }}/core"
          cd "${{ runner.temp }}/core"
          if command -v shasum >/dev/null; then
            tr -d '\r' < *.sha256 | shasum -a 256 -c -
          else
            tr -d '\r' < *.sha256 | sha256sum -c -
          fi
          tar -xzf *.tar.gz
      - name: Build, test, install, and package
        run: >-
          micromamba run -n package-ci python tools/ci/run.py
          --platform ${{ matrix.platform }} --jobs ${{ (startsWith(runner.name, 'dax') && 24) || (startsWith(runner.name, 'studio') && 8) || (startsWith(runner.name, 'DESKTOP') && 8) || matrix.jobs }}
          --core-dir "${{ runner.temp }}/core"
          --cli-source dependencies/cli
          --prose-source dependencies/prose
          --flash-source dependencies/flash
          --test-data-source dependencies/test-data
          --work-dir "${{ runner.temp }}/pyopenms"
      - name: Upload tested package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pyopenms-${{ matrix.platform }}
          path: ${{ runner.temp }}/pyopenms/dist/*
          if-no-files-found: error
          compression-level: 0
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: results-${{ matrix.platform }}
          path: ${{ runner.temp }}/pyopenms/results/
          if-no-files-found: warn
