name: pyOpenMS

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'Casks/**'
      - 'README.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.platform }} / Release
    # Pushes and dispatches build Linux x64 on the dax runner and macOS arm64 on the
    # Mac Studio; pull requests from forks must never run there, so they stay hosted.
    runs-on: ${{ (github.event_name != 'pull_request' && matrix.platform == 'linux-x64' && 'dax-linux-x64') || (github.event_name != 'pull_request' && matrix.platform == 'macos-arm64' && 'studio-macos-arm64') || matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            packages: gcc_linux-64=14 gxx_linux-64=14 coin-or-cbc=2.10.*
            jobs: 4
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            packages: gcc_linux-aarch64=14 gxx_linux-aarch64=14 coin-or-cbc=2.10.*
            jobs: 4
          - platform: macos-arm64
            runner: macos-15
            packages: llvm-openmp coin-or-cbc=2.10.*
            jobs: 2
          - platform: macos-x64
            runner: macos-15-intel
            packages: llvm-openmp coin-or-cbc=2.10.*
            jobs: 4
          - platform: windows-x64
            runner: windows-2022
            packages: glpk=5.*
            jobs: 4
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: okohlbacher/OpenMS4-cli
          ref: d5213ff3551a8608e4e3f930fd4a6f85a8c82f97
          path: dependencies/cli
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: okohlbacher/OpenMS4-test-data
          ref: a14ecf5d5f5de878dbaf5ddb9feafe154b02303a
          path: dependencies/test-data
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: okohlbacher/OpenMS4-prose
          ref: 828d72595677f6cd22e8c02eca24956855dfcf1c
          path: dependencies/prose
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: okohlbacher/OpenMS4-flash
          ref: b2c6771de7746c43ad55558d17429a15087083fb
          path: dependencies/flash
          persist-credentials: false
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          environment-file: tools/ci/environment.yml
          micromamba-version: 2.9.0-0
          create-args: ${{ matrix.packages }}
          init-shell: none
          generate-run-shell: false
          cache-environment: true
          cache-environment-key: pyopenms-${{ matrix.platform }}
          post-cleanup: all
      - name: Install the exact nanobind the bindings require
        shell: bash
        run: |
          # The bindings ask for nanobind 2.10.0 EXACT. conda-forge went from
          # 2.9.2 to 2.10.2 without packaging 2.10.0, so it comes from PyPI.
          micromamba run -n package-ci python -m pip install --no-input nanobind==2.10.0
          micromamba run -n package-ci python -c "import nanobind, sys; assert nanobind.__version__ == '2.10.0', nanobind.__version__; print('nanobind', nanobind.__version__)"
      - name: Download and verify the pinned Core SDK
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/core"
          gh release download core-v4.0.0-ci.2 --repo okohlbacher/OpenMS4-core \
            --pattern "OpenMS4-core-${{ matrix.platform }}-Release-bc9cc12514c7.tar.gz*" \
            --dir "${{ runner.temp }}/core"
          cd "${{ runner.temp }}/core"
          if command -v shasum >/dev/null; then
            tr -d '\r' < *.sha256 | shasum -a 256 -c -
          else
            tr -d '\r' < *.sha256 | sha256sum -c -
          fi
          tar -xzf *.tar.gz
      - name: Build, test, install, and package
        run: >-
          micromamba run -n package-ci python tools/ci/run.py
          --platform ${{ matrix.platform }} --jobs ${{ (startsWith(runner.name, 'dax') && 24) || (startsWith(runner.name, 'studio') && 8) || matrix.jobs }}
          --core-dir "${{ runner.temp }}/core"
          --cli-source dependencies/cli
          --prose-source dependencies/prose
          --flash-source dependencies/flash
          --test-data-source dependencies/test-data
          --work-dir "${{ runner.temp }}/pyopenms"
      - name: Upload tested package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pyopenms-${{ matrix.platform }}
          path: ${{ runner.temp }}/pyopenms/dist/*
          if-no-files-found: error
          compression-level: 0
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: results-${{ matrix.platform }}
          path: ${{ runner.temp }}/pyopenms/results/
          if-no-files-found: warn
