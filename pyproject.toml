# pyOpenMS - nanobind-based Python bindings for OpenMS
# Build system configuration using PEP 517/518/621 with py-build-cmake
#
# Prerequisites:
#   The exact OpenMS core SDK from dependencies.lock.json must be installed
#   Set OpenMS_ROOT environment variable to point to OpenMS SDK installation prefix
#
# Build with:
#   pip wheel . --no-build-isolation  (after setting OpenMS_ROOT)
#   uv build --wheel
#   pip install . --config-settings=override=cmake.options.OpenMS_ROOT=/path/to/openms

[build-system]
# Also update dependency-group.build when making changes here!!!
requires = [
    "build>=1.3.0",
    "py-build-cmake>=0.3.0",
    "nanobind==2.10.0",
    "numpy>=2.0",
    "auditwheel; sys_platform == 'linux'",
    "delocate; sys_platform == 'darwin'",
    "delvewheel; sys_platform == 'win32'",
]
build-backend = "py_build_cmake.build"

[project]
name = "pyopenms"
# Version is set here; CI will update this dynamically for nightly builds (appends .devYYYYMMDD)
version = "4.0.0.dev0"
description = "Python wrapper for C++ LC-MS library OpenMS"
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.10"
authors = [
    {name = "The OpenMS team", email = "webmaster@openms.de"},
]
maintainers = [
    {name = "The OpenMS team", email = "open-ms-general@lists.sourceforge.net"},
]
keywords = [
    "mass spectrometry",
    "proteomics",
    "metabolomics",
    "LC-MS",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.5",
]

[project.urls]
Homepage = "https://openms.de"
Documentation = "https://pyopenms.readthedocs.io"
"Source Code" = "https://github.com/okohlbacher/OpenMS4-pyopenms"
"Bug Tracker" = "https://github.com/OpenMS/OpenMS/issues"
"Documentation Source" = "https://github.com/OpenMS/pyopenms-docs"

[project.optional-dependencies]
dataframes = ["pandas"]
# pyarrow 24.0.0 on PyPI only shipped cp310 wheels (no source distribution),
# breaking uv sync on cp311/cp312/cp313 runners. Pin out of 24.0.0 until a
# release with complete wheel coverage lands.
# pyarrow 25.0.0 segfaults on macOS arm64 (cp310) when reading a parquet
# dataset via pyarrow.dataset/parquet.core.read_table (crashes on import of
# pyarrow.dataset, see OpenMS test_XIPMParquetFile.py::test_xipm_run_dict).
# Pin out of 25.0.0 until upstream fixes the crash.
arrow = ["pyarrow!=24.0.0,!=25.0.0"]
all = ["pandas", "pyarrow!=24.0.0,!=25.0.0"]
test = ["pytest", "pytest-cov", "docutils", "pandas", "pyarrow!=24.0.0,!=25.0.0"]

# Dependency groups (PEP 735) - installable with: uv sync --only-group <name>
[dependency-groups]
build = [
    "build>=1.3.0",
    "py-build-cmake>=0.3.0",
    "nanobind==2.10.0",
    "numpy>=2.0",
    "auditwheel; sys_platform == 'linux'",
    "delocate; sys_platform == 'darwin'",
    "delvewheel; sys_platform == 'win32'",
]
test = [
    "pytest",
    "pytest-cov",
    "docutils",
    "pandas",  # tests need pandas for DataFrame functionality
    "pyarrow!=24.0.0,!=25.0.0",  # see [project.optional-dependencies].arrow for the exclusion rationale
]
dev = [
    {include-group = "build"},
    {include-group = "test"},
    "matplotlib>=3.5",
]

#------------------------------------------------------------------------------
# py-build-cmake configuration
#------------------------------------------------------------------------------

[tool.py-build-cmake.module]
# The Python package is partially generated by CMake (compiled extensions)
name = "pyopenms"
directory = "pyopenms"
generated = "package"

[tool.py-build-cmake.sdist]
# Files to include in source distribution
include = [
    "CMakeLists.txt",
    "pyproject.toml",
    "README.rst",
    "README.md",
    "License.txt",
    "source-provenance.json",
    "dependencies.lock.json",
    "cmake/*.cmake",
    "cmake/*.in",
    "tests/**",
    "tools/*.py",
    "tools/native_arrow/**",
    "MANIFEST.in",
    "pyopenms/*.py",
    "pyopenms/*.pyi",
    "pyopenms/py.typed",
    "pyopenms/addons/*.py",
    "bindings/bind_*.cpp",
    "bindings/main_module.cpp",
    "bindings/arrow_zerocopy.cpp",
    "bindings/*.h",
    "bindings/type_casters/*.h",
    "fix_stubs.py",
    "stubs.patch",
]

[tool.py-build-cmake.cmake]
# CMake build configuration
build_type = "Release"
source_path = "."
install_args = ["--strip"]
build_args = []
install_components = ["python_modules"]

[tool.py-build-cmake.cmake.options]
# CMake options - OpenMS_ROOT should be set via environment or config-settings
# Example: pip install . --config-settings=override=cmake.options.OpenMS_ROOT=/path/to/openms
# Or set environment variable: export OpenMS_ROOT=/path/to/openms
#
# Skip dependency bundling - wheel repair tools will usually handle this
NO_DEPENDENCIES = "ON"


#------------------------------------------------------------------------------
# cibuildwheel configuration
#------------------------------------------------------------------------------

[tool.cibuildwheel]
# Build for Python 3.10-3.14 (usually overwritten by GitHub Actions)
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
# Skip 32-bit and musllinux builds
skip = "*-win32 *-musllinux_*"

# Test the wheel after building
test-requires = ["pytest", "numpy", "docutils", "pandas", "pyarrow!=24.0.0,!=25.0.0"]
test-command = "pytest \"{package}/tests\" --import-mode=importlib"
build-verbosity = 1

# Override cmake options for wheel building with repair tools
[tool.cibuildwheel.config-settings]
"override" = [
    "cmake.options.NO_DEPENDENCIES=ON",
    "cmake.options.PYOPENMS_PREPARE_WHEEL_REPAIR=ON"
]

# Each runner must provision the pinned SDK and fixture packages first and pass
# OpenMS_DIR/CMAKE_PREFIX_PATH plus OPENMS_*_TEST_DATA_PATH into the build/test
# environment. Container images and C++ dependencies are owned by the SDK release.
[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
archs = ["arm64"]
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[tool.cibuildwheel.windows]
archs = ["AMD64"]
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"

#------------------------------------------------------------------------------
# pytest configuration
#------------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test*"]
addopts = "-v --tb=short"
